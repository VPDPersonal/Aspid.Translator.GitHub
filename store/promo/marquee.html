<!doctype html>
<!-- Chrome Web Store marquee promo tile, 1400×560. Rendered by store/render.mjs. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="promo.css">
<style>
  body { width: 1400px; height: 560px; }
  .tile { height: 100%; display: grid; grid-template-columns: 552px 1fr; align-items: center; padding: 0 80px; gap: 52px; }
  .brand-logo { width: 146px; margin-bottom: 26px; }
  h1 { font-size: 49px; }
  .tagline { margin-top: 15px; font-size: 26px; }
  .example {
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--panel);
    box-shadow: 0 24px 56px rgb(0 0 0 / .4);
  }
  .translation { padding: 25px 29px; }
  .translation + .translation { border-top: 1px solid var(--line); }
  .label { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; color: var(--muted); font-size: 16px; }
  .translation:last-child .label { color: var(--accent); }
  .translation p { font-size: 21px; line-height: 1.5; }
  .translation code {
    padding: .1em .3em;
    border-radius: 4px;
    background: rgb(146 149 159 / .12);
    color: var(--strong);
    font: 85% ui-monospace, monospace;
  }
</style>
</head>
<body>
<main class="tile bg">
  <div>
    <img class="brand-logo" src="../../assets/banner-logo.svg" alt="" width="146" height="146">
    <h1><span class="brand-prefix">Aspid.</span>Translator.GitHub</h1>
    <p class="tagline">Read GitHub in your own language</p>
  </div>
  <div class="example">
    <div class="translation">
      <div class="label">Original · Chinese</div>
      <p lang="zh-Hans">修复 H5 端 <code>createIntersectionObserver</code> 在目标就是容器自身时，<code>observe</code> 回调不触发的问题。</p>
    </div>
    <div class="translation">
      <div class="label"><img src="../../assets/banner-logo.svg" alt="" width="19" height="19">Translated · English</div>
      <p>Fixes the <code>observe</code> callback not firing in <code>createIntersectionObserver</code> on H5 when the target is the container itself.</p>
    </div>
  </div>
</main>
</body>
</html>
