<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="icons/icon-32.png">
  <link rel="stylesheet" href="fonts/fonts.css">
  <title>Aspid.Translator.GitHub</title>
  <style>
    /* The FastTools Venom palette with its default green accent. */
    :root {
      color-scheme: light dark;
      --bg: #f7f7f8; --panel: #ffffff; --canvas: #e6e7eb; --hair: #e3e4e8; --line: #d3d5db;
      --fg: #2a2c31; --strong: #121316; --muted: #5a5e66;
      --accent: #1d8840; --ink: #ffffff; --deep: #177035;
      --glow-soft: rgb(34 160 75 / 0.11); --spark: #1d8840;
      --shadow: 0 18px 48px -16px rgb(18 19 22 / 0.3);
      --serif: 'IBM Plex Serif', ui-serif, Georgia, serif;
      --sans: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0a0b0f; --panel: #10121a; --canvas: #06080b; --hair: #1c1f28; --line: #272b35;
        --fg: #c8c8cc; --strong: #f0f0f2; --muted: #92959f;
        --accent: #5cb46b; --ink: #06140a; --deep: #357a42;
        --glow-soft: rgb(92 180 107 / 0.1); --spark: #7ed38e;
        --shadow: 0 18px 48px -16px rgb(0 0 0 / 0.7);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--fg);
      font: 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased;
    }
    .banner {
      --dot-step: clamp(18px, 2.25vw, 30px);
      --dot-origin: center calc(100% + var(--dot-step) / 2 - 5px);
      position: relative; isolation: isolate; overflow: clip;
      border-bottom: 1px solid var(--line);
      background: var(--canvas)
        radial-gradient(circle, color-mix(in srgb, var(--muted) 18%, transparent) 1.1px, transparent 1.5px)
        var(--dot-origin) / var(--dot-step) var(--dot-step);
    }
    .banner::before, .banner-sparks { position: absolute; inset: 0; z-index: -1; pointer-events: none; }
    .banner::before {
      content: '';
      background: radial-gradient(circle, color-mix(in srgb, var(--accent) 78%, transparent) 1.75px, transparent 2.35px)
        var(--dot-origin) / var(--dot-step) var(--dot-step);
      mask-image: linear-gradient(to top, #000, transparent calc(2 * var(--dot-step)));
    }
    .banner-sparks span {
      position: absolute; left: var(--x); top: var(--y); width: 18px; height: 18px; translate: -50% -50%;
      opacity: .55;
      background: radial-gradient(circle, var(--spark) 1.35px, color-mix(in srgb, var(--accent) 34%, transparent) 1.8px, transparent 8px);
    }
    .banner-sparks span:nth-child(1) { --x: 9%; --y: 61%; --delay: -2s; }
    .banner-sparks span:nth-child(2) { --x: 24%; --y: 25%; --delay: -5s; }
    .banner-sparks span:nth-child(3) { --x: 36%; --y: 79%; --delay: -3.5s; }
    .banner-sparks span:nth-child(4) { --x: 61%; --y: 18%; --delay: -6s; }
    .banner-sparks span:nth-child(5) { --x: 77%; --y: 73%; --delay: -2.75s; }
    .banner-sparks span:nth-child(6) { --x: 93%; --y: 38%; --delay: -4.25s; }
    @media (prefers-reduced-motion: no-preference) {
      .banner::before { animation: banner-glow 7.8s ease-in-out infinite; }
      .banner-sparks span { animation: banner-spark 9s ease-in-out var(--delay) infinite; }
    }
    @keyframes banner-glow { 50% { opacity: .6; } }
    @keyframes banner-spark {
      from { opacity: 0; transform: translate(-5px, 35px); }
      40%, 60% { opacity: .65; }
      to { opacity: 0; transform: translate(7px, -55px); }
    }
    .banner-content, form { max-width: 1088px; margin-inline: auto; padding-inline: 32px; }
    .banner-content { display: flex; align-items: center; gap: clamp(24px, 4vw, 48px); padding-block: 36px; }
    .banner-logo { flex: none; width: clamp(112px, 16vw, 176px); height: auto; }
    .banner-text { min-width: 0; }
    h1, h2, p { margin: 0; }
    h1 {
      font: 500 clamp(36px, 5.4vw, 60px)/1.05 var(--serif); letter-spacing: -0.02em;
      color: var(--strong); text-wrap: balance;
    }
    h1 .brand { color: var(--accent); }
    .tagline { max-width: 60ch; margin-top: 12px; color: var(--fg); font-size: clamp(18px, 2vw, 22px); font-weight: 500; text-wrap: pretty; }
    form { display: grid; grid-template-columns: minmax(0, .73fr) minmax(0, 1.27fr); align-items: start; gap: 36px; padding-block: 32px 80px; }
    .general, section { display: grid; min-width: 0; gap: 14px; }
    .general { gap: 26px; }
    .shortcut { flex-wrap: wrap; }
    .shortcut-edit {
      display: inline-flex; align-items: center; gap: 8px; min-height: 32px; padding: 4px 10px;
      border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--strong);
      font: 500 14px/1.4 var(--sans); text-decoration: none;
    }
    .shortcut-edit svg { flex: none; color: var(--muted); }
    .shortcut-edit:hover { border-color: var(--accent); }
    .section-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 16px; }
    h2 { font: 600 22px/1.3 var(--serif); color: var(--strong); letter-spacing: -.02em; }
    .group-name { flex: 1; font-size: 15px; font-weight: 600; color: var(--strong); }
    .count, .group-count { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    .card, .groups { border: 1px solid var(--line); background: var(--panel); border-radius: 12px; }
    .group-body { padding: 0 16px 12px; }
    details + details { border-top: 1px solid var(--hair); }
    summary { list-style: none; display: flex; align-items: center; gap: 12px; cursor: pointer; padding: 15px 18px; border-radius: 10px; }
    summary::-webkit-details-marker { display: none; }
    summary::after { content: ''; width: 7px; height: 7px; border: solid var(--muted); border-width: 0 1.5px 1.5px 0; transform: rotate(45deg); margin: -3px 3px 0; }
    details[open] > summary::after { transform: rotate(225deg); margin-top: 3px; }
    summary .icon { box-sizing: content-box; padding: 7px; border-radius: 8px; background: var(--glow-soft); }
    .icon { flex: none; color: var(--accent); }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 14px; min-height: 44px; min-width: 0; padding: 8px 12px; }
    label.row { cursor: pointer; border-radius: 7px; }
    label.row:hover, summary:hover { background: color-mix(in srgb, var(--fg) 4%, transparent); }
    .group-body .row + .row, .provider + .provider { position: relative; }
    .group-body .row + .row::before, .provider + .provider::before {
      content: ''; position: absolute; inset: 0 0 auto; height: 1px; background: var(--hair); pointer-events: none;
    }
    .general .row { padding: 16px 18px; }
    .general .row:has(select) { display: grid; gap: 8px; font-weight: 600; }
    .divider { height: 1px; margin-inline: 18px; background: var(--hair); }
    .auto-setting { position: relative; }
    .auto-tip {
      display: none; position: absolute; z-index: 1; inset-block-start: 100%; inset-inline: 12px auto;
      max-width: calc(100% - 24px); padding: 6px 10px; border: 1px solid var(--line);
      border-radius: 6px; background: var(--strong); color: var(--panel); font-size: 13px;
    }
    .auto-setting:not(.dismissed):is(:hover, :has(:focus-visible)) .auto-tip { display: block; }
    .text { display: grid; gap: 4px; min-width: 0; }
    .hint { color: var(--muted); font-size: 13px; text-wrap: pretty; }
    .group-body p { padding: 4px 12px 6px; }
    .select { position: relative; min-width: 0; }
    .select svg { position: absolute; inset-inline-end: 12px; top: 50%; translate: 0 -50%; pointer-events: none; color: var(--muted); }
    select {
      appearance: none; display: block; width: 100%; min-width: 0; height: 40px;
      padding-inline: 12px 36px; border: 1px solid var(--line); border-radius: 7px;
      background: var(--bg); color: var(--strong); font: 500 15px var(--sans); cursor: pointer;
    }
    @media (max-width: 740px) {
      .banner-content, form { max-width: 600px; padding-inline: 16px; }
      .banner-content { flex-direction: column; gap: 14px; padding-block: 28px; text-align: center; }
      .banner-logo { width: 88px; }
      h1 { font-size: clamp(28px, 6vw, 40px); }
      .tagline { margin-inline: auto; }
      form { grid-template-columns: minmax(0, 1fr); gap: 22px; padding-block: 24px 72px; }
      .general { gap: 18px; }
      section { gap: 9px; }
    }
    /* Off: an outline that keeps 3:1 against the card; on: the accent fill with its ink, like the sites' filled marks. */
    .switch {
      appearance: none; flex: none; position: relative; box-sizing: border-box; width: 42px; height: 24px; margin: 0;
      border: 1.5px solid var(--muted); border-radius: 999px; background: transparent; cursor: pointer;
      transition: background-color 0.15s, border-color 0.15s;
    }
    .switch::before {
      content: ''; position: absolute; top: 3.5px; inset-inline-start: 3.5px; width: 14px; height: 14px; border-radius: 50%;
      background: var(--muted); transition: transform 0.15s, background-color 0.15s;
    }
    .switch:checked { border-color: var(--accent); background: var(--accent); }
    .switch:checked::before { background: var(--ink); transform: translateX(18px); }
    .switch:checked:dir(rtl)::before { transform: translateX(-18px); }
    .provider { flex-wrap: nowrap; justify-content: flex-start; gap: 12px; padding: 16px; }
    .provider input { margin: 0; accent-color: var(--accent); }
    .provider:has(input[hidden]) { cursor: default; }
    .provider:has(input[hidden]):hover { background: none; }
    .provider .name { font-weight: 600; color: var(--strong); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .toast {
      position: fixed; left: 50%; bottom: 24px; display: flex; align-items: center; gap: 10px;
      box-sizing: border-box; max-width: calc(100% - 32px); padding: 12px 16px;
      border: 1px solid var(--deep); border-radius: 10px; background: linear-gradient(var(--glow-soft), var(--glow-soft)) var(--panel);
      color: var(--strong); box-shadow: var(--shadow); font-size: 14px;
      translate: -50% 12px; opacity: 0; pointer-events: none; transition: opacity 0.2s, translate 0.2s;
    }
    .toast.shown { translate: -50% 0; opacity: 1; }
    @media (prefers-reduced-motion: reduce) {
      .switch, .switch::before, .toast { transition: none; }
    }
  </style>
</head>
<body>
<main>
  <header class="banner">
    <div class="banner-sparks" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="banner-content">
      <img class="banner-logo" src="icons/banner-logo.svg" alt="" width="176" height="176">
      <div class="banner-text">
        <h1><bdi lang="en" dir="ltr"><span class="brand">Aspid.</span><wbr>Translator.<wbr>GitHub</bdi></h1>
        <p class="tagline" data-i18n="settingsTagline"></p>
      </div>
    </div>
  </header>

  <form id="form" inert>
    <div class="general">
      <section>
        <h2 data-i18n="settingsTranslation"></h2>
        <div class="card">
          <div class="row">
            <label for="target" data-i18n="settingsTarget"></label>
            <div class="select">
              <select id="target"></select>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
            </div>
          </div>
          <div class="divider"></div>
          <div class="auto-setting">
            <label class="row">
              <span data-i18n="settingsAuto"></span>
              <input type="checkbox" role="switch" class="switch" id="auto" aria-describedby="auto-tip">
            </label>
            <span class="auto-tip" id="auto-tip" role="tooltip" data-i18n="settingsAutoHint"></span>
          </div>
          <div class="divider"></div>
          <div class="row shortcut">
            <span data-i18n="shortcutLabel"></span>
            <a class="shortcut-edit" id="edit-shortcut" href="chrome://extensions/shortcuts">
              <span id="shortcut" dir="ltr"></span>
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="m2 14 3.5-.8 8.2-8.2a1.7 1.7 0 0 0-2.4-2.4l-8.5 8zM9.7 4.3l2.4 2.4"/></svg>
            </a>
          </div>
        </div>
      </section>

      <section>
        <h2 data-i18n="settingsEngine"></h2>
        <div class="card" id="providers"></div>
      </section>
    </div>

    <section>
      <div class="section-head">
        <h2 data-i18n="settingsParts"></h2>
        <span class="count" id="count"></span>
      </div>
      <div class="groups">
        <details open>
          <summary>
            <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M6 8.5v7"/><path d="M18 15.5V9a3 3 0 0 0-3-3h-4"/><path d="M13 3.5 10.5 6 13 8.5"/></svg>
            <span class="group-name" data-i18n="settingsGroupPr"></span>
            <span class="group-count"></span>
          </summary>
          <div class="group-body">
            <label class="row"><span data-i18n="partPrTitle"></span><input type="checkbox" role="switch" class="switch" data-part="prTitle"></label>
            <label class="row"><span data-i18n="partPrBody"></span><input type="checkbox" role="switch" class="switch" data-part="prBody"></label>
            <label class="row"><span data-i18n="partComments"></span><input type="checkbox" role="switch" class="switch" data-part="comments"></label>
            <label class="row"><span data-i18n="partReviewComments"></span><input type="checkbox" role="switch" class="switch" data-part="reviewComments"></label>
          </div>
        </details>
        <details>
          <summary>
            <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M3 12h5.5M15.5 12H21"/></svg>
            <span class="group-name" data-i18n="settingsGroupCommits"></span>
            <span class="group-count"></span>
          </summary>
          <div class="group-body">
            <label class="row"><span data-i18n="partCommitTitles"></span><input type="checkbox" role="switch" class="switch" data-part="commitTitles"></label>
            <label class="row"><span data-i18n="partCommitBodies"></span><input type="checkbox" role="switch" class="switch" data-part="commitBodies"></label>
            <p class="hint" data-i18n="settingsCommitsHint"></p>
          </div>
        </details>
        <details>
          <summary>
            <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg>
            <span class="group-name" data-i18n="settingsGroupFiles"></span>
            <span class="group-count"></span>
          </summary>
          <div class="group-body">
            <label class="row"><span data-i18n="partReadme"></span><input type="checkbox" role="switch" class="switch" data-part="readme"></label>
            <p class="hint" data-i18n="settingsFilesHint"></p>
          </div>
        </details>
        <details>
          <summary>
            <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/></svg>
            <span class="group-name" data-i18n="settingsGroupRepository"></span>
            <span class="group-count"></span>
          </summary>
          <div class="group-body">
            <label class="row"><span data-i18n="partAbout"></span><input type="checkbox" role="switch" class="switch" data-part="about"></label>
          </div>
        </details>
        <details>
          <summary>
            <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15" rx="2"/><path d="M3 9h18M9 9v10"/></svg>
            <span class="group-name" data-i18n="settingsGroupPages"></span>
            <span class="group-count"></span>
          </summary>
          <div class="group-body">
            <label class="row"><span data-i18n="partIssues"></span><input type="checkbox" role="switch" class="switch" data-part="issues"></label>
            <label class="row"><span data-i18n="partLists"></span><input type="checkbox" role="switch" class="switch" data-part="lists"></label>
            <label class="row"><span data-i18n="partReleases"></span><input type="checkbox" role="switch" class="switch" data-part="releases"></label>
            <label class="row"><span data-i18n="partDiscussions"></span><input type="checkbox" role="switch" class="switch" data-part="discussions"></label>
            <label class="row"><span data-i18n="partWiki"></span><input type="checkbox" role="switch" class="switch" data-part="wiki"></label>
            <label class="row"><span data-i18n="partFeed"></span><input type="checkbox" role="switch" class="switch" data-part="feed"></label>
          </div>
        </details>
      </div>
    </section>

  </form>
</main>

<template id="provider-row">
  <label class="row provider">
    <input type="radio" name="provider">
    <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19h20"/></svg>
    <span class="name"></span>
  </label>
</template>

<div class="toast" id="toast" role="status">
  <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
  <span id="toast-text"></span>
</div>
<script src="options.js"></script>
</body>
</html>
